# fleet tmux config — loaded only on the isolated `-L fleet` server.
# Does not affect your default tmux server or any ~/.tmux.conf you add later.

set -g mouse on                 # wheel-scroll, click-to-select pane, drag-select
set -g history-limit 50000
set -g base-index 0             # window 0 = the dashboard (the FLEET slot); agents are 1+
setw -g pane-base-index 1
set -g renumber-windows on      # keep agent tab numbers gap-free as you close sessions
set -g escape-time 10
set -g focus-events on

set -g set-titles on
set -g set-titles-string "fleet: #{window_name}"

# --- status bar: shows every session/window so you can see the fleet at a glance
set -g status-interval 15    # slow periodic status redraw so it doesn't dismiss open menus
# Colours below are the DARK theme defaults. fleet overrides status-style,
# status-left/right and the current-tab style from THEMES in fleet.py whenever
# it starts the server or reloads this file — pick one with `fleet theme light`.
set -g status-style "bg=colour236,fg=colour250"
# FLEET label (window 0 = the dashboard). Highlighted when you're on it; click it
# or press Alt+` to go there. It is NOT a numbered tab.
set -g status-left "#{?#{==:#{window_index},0},#[fg=black#,bg=colour214#,bold],#[fg=colour214#,bold]} FLEET #[default] "
set -g status-left-length 24
set -g status-right "#[fg=colour245]%H:%M "
setw -g window-status-current-style "bg=colour24,fg=white,bold"
# hide window 0 (the dashboard) from the numbered tab list — it's the FLEET label
setw -g window-status-format "#{?#{==:#{window_index},0},, #I:#W }"
setw -g window-status-current-format "#{?#{==:#{window_index},0},, #I:#W }"

# --- copy to the system clipboard: drag-select with the mouse, or `y` in copy-mode.
#     macOS first (pbcopy), then WSL (clip.exe), then Wayland/X11 — one chain
#     for every platform: whatever isn't installed falls through to the next.
set -g set-clipboard on          # also emit OSC52 for terminals that support it
bind -T copy-mode      MouseDragEnd1Pane send -X copy-pipe-and-cancel 'sh -c "pbcopy 2>/dev/null || clip.exe 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || cat >/dev/null"'
bind -T copy-mode-vi   MouseDragEnd1Pane send -X copy-pipe-and-cancel 'sh -c "pbcopy 2>/dev/null || clip.exe 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || cat >/dev/null"'
bind -T copy-mode      y send -X copy-pipe-and-cancel 'sh -c "pbcopy 2>/dev/null || clip.exe 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || cat >/dev/null"'
bind -T copy-mode-vi   y send -X copy-pipe-and-cancel 'sh -c "pbcopy 2>/dev/null || clip.exe 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || cat >/dev/null"'

# --- quick navigation (no prefix):
#   Alt+←/→ prev/next (incl. dashboard) · Alt+1..9 jump to agent tab N
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
# Alt+` (or click the yellow FLEET label at bottom-left) goes to the dashboard
# (window 0), all within this one terminal.
bind -n M-`     select-window -t :0
bind -n MouseDown1StatusLeft select-window -t :0

# --- reorder tabs: move the CURRENT tab left/right (focus follows it)
#   Alt+,/Alt+. (no prefix). Also: right-click a tab, or prefix + < for a menu.
#   IMPORTANT: never bind Shift+<key> here — binding a Shift chord forces tmux to
#   enable shift-key reporting, which breaks typing capitals / '?' in the inner app.
unbind -n M-S-Left
unbind -n M-S-Right
unbind -T prefix S-Left
unbind -T prefix S-Right
set -s extended-keys off
bind -n M-, swap-window -d -t -1
bind -n M-. swap-window -d -t +1

# right-click a tab: press-and-hold menu (hold right button, release over an item).
# (The "click to open / stays up" MouseUp3 version auto-closed too often because the
# live status bar keeps redrawing and dismisses an already-open menu.)
unbind -n MouseUp3Status
bind -n MouseDown3Status display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W \
  "Swap Left"  l { swap-window -d -t -1 } \
  "Swap Right" r { swap-window -d -t +1 } \
  "" \
  Rename       n { command-prompt -I "#W" { rename-window -- "%%" } } \
  "New Tab"    c { new-window } \
  "" \
  Kill         X { kill-window }
# also size each window to whichever client is actually viewing it (so the
# dashboard tab and a session tab can differ in size without clamping)
setw -g aggressive-resize on

# the FLEET dashboard (window 0) is not closeable via prefix-& (kill-window)
bind & if-shell -F '#{==:#{window_index},0}' \
  'display-message "the FLEET dashboard cannot be closed"' \
  'confirm-before -p "kill-window #W? (y/n)" kill-window'

# prefix r reloads this config. fleet sets @fleet_conf to the real path of this
# file (wherever the repo is checked out) when it creates/attaches the session.
bind r run-shell 'tmux source-file "$(tmux show -gv @fleet_conf)"' \; display "fleet config reloaded"
